<script>

<style>
  body{font-family:system-ui,sans-serif;background:#fafaf9;color:#292524;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px}
  .c{max-width:460px;text-align:center}
  .b{display:inline-block;margin-top:14px;background:#d97706;color:#fff;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:600}

<body>

  <small>Demostración sin inicio de sesión · <a href="prototipo.html">ver prototipo estático anterior</a></small>

<script>
  var ok = URL_SISTEMA.indexOf('PEGAR-AQUI') === -1;
  document.getElementById('enlace').href = ok ? URL_SISTEMA : '#';

  else document.getElementById('msg').textContent = 'Falta configurar la dirección del sistema.';
</script>
