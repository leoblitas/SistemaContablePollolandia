":"1.1.03.04","n":"Inventario – Torta de Soya","d":"Registra las existencias de torta de soya como materia prima proteica para la elaboración interna de alimento balanceado. Cuenta de uso exclusivo a partir del ejercicio 2027.","s":"Deudora","db":["Por la compra de torta de soya a proveedores, al costo de adquisición."],"cr":["Por el consumo en la elaboración de alimento balanceado, con cargo al centro de costos 6.1.01.02.","Por bajas autorizadas por deterioro."]},{"c":"1.1.03.05","n":"Inventario – Afrecho de Trigo","d":"Registra las existencias de afrecho de trigo como materia prima fibrosa para la elaboración interna de alimento balanceado. Cuenta de uso exclusivo a partir del ejercicio 2027.","s":"Deudora","db":["Por la compra de afrecho de trigo, al costo de adquisición."],"cr":["Por el consumo en la elaboración de alimento balanceado, con cargo al centro de costos 6.1.01.02.","Por bajas autorizadas por deterioro."]},{"c":"1.1.03.06","n":"Inventario – Núcleo Vitamínico","d":"Registra las existencias de núcleo vitamínico-mineral utilizado como aditivo en la formulación del alimento balanceado. Cuenta de uso exclusivo a partir del ejercicio 2027.","s":"Deudora","db":["Por la compra de núcleo vitamínico, al costo de adquisición."],"cr":["Por el consumo en la elaboración de alimento balanceado, con cargo al centro de costos 6.1.01.02.","Por bajas por vencimiento debidamente autorizadas."]},{"c":"1.1.03.07","n":"Inventario – Aceite Vegetal","d":"Registra las existencias de aceite vegetal utilizado como fuente energética en la formulación del alimento balanceado. Cuenta de uso exclusivo a partir del ejercicio 2027.","s":"Deudora","db":["Por la compra de aceite vegetal, al costo de adquisición."],"cr":["Por el consumo en la elaboración de alimento balanceado, con cargo al centro de costos 6.1.01.02.","Por bajas autorizadas por deterioro o rancidez."]},{"c":"1.1.03.08","n":"Inventario – Productos Veterinarios","d":"Registra las existencias de vacunas, antibióticos y demás insumos veterinarios utilizados en el manejo sanitario de los lotes de aves.","s":"Deudora","db":["Por la compra de productos veterinarios, al costo de adquisición."],"cr":["Por el consumo en el proceso de crianza, con cargo al centro de costos 6.1.01.01 (sufijo correspondiente).","Por bajas de productos vencidos o deteriorados, debidamente autorizadas."]},{"c":"1.1.03.09","n":"Inventario – Insumos de Limpieza y Desinfección","d":"Registra las existencias de desinfectantes, detergentes y demás insumos destinados a la bioseguridad y limpieza de los galpones.","s":"Deudora","db":["Por la compra de insumos de limpieza y desinfección, al costo de adquisición."],"cr":["Por el consumo en el proceso de crianza, con cargo al centro de costos 6.1.01.01 (sufijo 09).","Por bajas autorizadas por deterioro."]},{"c":"1.1.03.10","n":"Inventario – Insumos de Crianza","d":"Registra las existencias de insumos generales de crianza (cama de galpón, material de nidos u otros) no clasificados en otras cuentas específicas de inventario.","s":"Deudora","db":["Por la compra de insumos de crianza, al costo de adquisición."],"cr":["Por el consumo en el proceso de crianza, con cargo al centro de costos 6.1.01.01 (sufijo 10).","Por bajas autorizadas por deterioro."]},{"c":"1.1.03.11","n":"Inventario – Insumos de Embalaje y Comercialización","d":"Registra las existencias de material de empaque, etiquetado y trazabilidad (incluido el código QR) utilizado en la fase de faenado y comercialización del producto terminado.","s":"Deudora","db":["Por la compra de insumos de embalaje y comercialización, al costo de adquisición."],"cr":["Por el consumo en la fase de faenado y empacado del producto terminado.","Por bajas autorizadas por deterioro u obsolescencia del material."]},{"c":"1.1.03.12","n":"Inventario – Productos Terminados: Carne de Pollo","d":"Registra el valor de la carne de pollo obtenida al término del ciclo productivo de 73 días, disponible para su venta a los mercados HORECA, familiar y r la compra de materiales de mantenimiento, al costo de adquisición."],"cr":["Por el consumo de materiales en labores de mantenimiento de activos fijos, con cargo al centro de costos o cuenta de gasto correspondiente.","Por bajas autorizadas por deterioro u obsolescencia."]},{"c":"1.1.04","n":"PAGOS ANTICIPADOS Y OTROS ACTIVOS CORRIENTES","d":"","s":"","db":[],"cr":[]},{"c":"1.1.04.01","n":"Anticipos a Proveedores de Insumos","d":"Registra los importes entregados por anticipado a proveedores de insumos (pollitos BB, materias primas, productos veterinarios, entre otros) a cuenta de futuras entregas de bienes.","s":"Deudora","db":["Por la entrega de anticipos en efectivo o mediante transferencia a proveedores."],"cr":["Por la aplicación del anticipo contra la factura o nota de compra al momento de la recepción del bien.","Por la devolución del anticipo, en caso de incumplimiento del proveedor."]},{"c":"1.1.04.02","n":"Gastos Pagados por Adelantado","d":"Registra los desembolsos efectuados por servicios o coberturas (seguros, alquileres u otros) cuyo beneficio económico se extiende a períodos futuros.","s":"Deudora","db":["Por el pago anticipado de primas de seguro, alquileres u otros servicios que benefician a ejercicios o meses futuros."],"cr":["Por la porción devengada del gasto, imputada al resultado del período o al costo de producción según corresponda, conforme al principio de Devengado (NC-1)."]},{"c":"1.1.04.03","n":"Otros Activos Corrientes","d":"Registra otras partidas de activo corriente de naturaleza residual no comprendidas en las cuentas específicas del Plan de Cuentas.","s":"Deudora","db":["Por el reconocimiento de derechos o valores de realización previsible dentro de los siguientes doce meses, no clasificables en otra cuenta corriente específica."],"cr":["Por la recuperación, aplicación o regularización de la partida registrada."]},{"c":"1.1.04.04","n":"Anticipos a personal eventual","d":"Registra los importes entregados por anticipado al personal eventual contratado por obra o servicio determinado (principalmente para labores de faenado), a cuenta de su liquidación.","s":"Deudora","db":["Por la entrega de anticipos de pago al personal eventual antes de la liquidación de su labor."],"cr":["Por el descuento del anticipo contra el pago final de la obra o servicio prestado."]},{"c":"1.2","n":"ACTIVO NO CORRIENTE","d":"","s":"","db":[],"cr":[]},{"c":"1.2.01","n":"PROPIEDAD, PLANTA Y EQUIPO","d":"","s":"","db":[],"cr":[]},{"c":"1.2.01.01","n":"Terrenos","d":"Registra el valor de los terrenos de propiedad de la cooperativa donde se asienta la infraestructura productiva (granja de Caranavi).","s":"Deudora","db":["Por la adquisición del terreno, al costo de compra.","Por mejoras que incrementen su valor (nivelación, habilitación), cuando corresponda capitalizarlas."],"cr":["Por la venta, donación o disposición del terreno."]},{"c":"1.2.01.02","n":"Galpones de Producción","d":"Registra el valor de las construcciones destinadas al alojamiento y engorde de las aves durante el ciclo productivo.","s":"Deudora","db":["Por el costo de construcción o adquisición del galpón, incluidos honorarios profesionales e instalación.","Por mejoras que incrementen su vida útil o capacidad productiva."],"cr":["Por la depreciación acumulada del período (cuenta reguladora).","Por la baja del bien por retiro, venta o siniestro."]},{"c":"1.2.01.03","n":"Alambrados y Cercados","d":"Registra el valor de los alambrados y cercados perimetrales de la granja, destinados a la seguridad y bioseguridad de las instalaciones.","s":"Deudora","db":["Por el costo de instalación del alambrado o cercado.","Por mejoras que incrementen su vida útil."],"cr":["Por la depreciación acumulada del período.","Por la baja del bien por retiro o reemplazo."]},{"c":"1.2.01.04","n":"Ambiente de Preparación de Alimento Balanceado","d":"Registra el valor de la construcción destinada a la elaboración interna de alimento balanceado. Cuenta de uso exclusivo a partir del ejercicio 2027.","s":"Deudora","db":["Por el costo de construcción o adecuación del ambiente.","Por mejoras que incrementen su vida útil o capacidad."],"cr":["Por la depreciación acumulada del período.","Por la baja del bien por retiro o venta."]},{"c":"1.2.01.05","n":"Maquinaria de Producción de Alimento Balanceado","d":"Registra el valor de la maquinaria destinada a la molienda, mezcla y peletizado del alimento balanceado elaborado internamente. Cuenta de uso exclusivo a partir del ejercicio 2027.","s":"Deudora","db":["Por la adquisición de la maquinaria, incluidos fletes, instalación y montaje.","Por mejoras que incrementen su capacidad o vida útil."],"cr":["Por la depreciación acumulada del período.","Por la baja del bien por retiro, venta u obsolescencia."]},{"c":"1.2.01.06","n":"Equipos de Producción Avícola","d":"Registra el valor de los comederos, bebederos, estufas, balanzas, ventiladores y demás equipos utilizados en el proceso de crianza y engorde de las aves.","s":"Deudora","db":["Por la adquisición del equipo, incluidos fletes e instalación.","Por mejoras que incrementen su vida útil."],"cr":["Por la depreciación acumulada del período.","Por la baja del bien por retiro, venta u obsolescencia."]},{"c":"1.2.01.07","n":"Herramientas de Producción","d":"Registra el valor de herramientas menores utilizadas en las labores productivas, tales como carretillas, palas, mochilas de fumigación, mangueras y cuchillos.","s":"Deudora","db":["Por la adquisición de las herramientas."],"cr":["Por la depreciación acumulada del período.","Por la baja del bien por pérdida, deterioro o reemplazo."]},{"c":"1.2.01.08","n":"Muebles y Enseres","d":"Registra el valor del mobiliario de oficina utilizado en las áreas administrativas de la cooperativa.","s":"Deudora","db":["Por la adquisición de muebles y enseres para uso administrativo."],"cr":["Por la depreciación acumulada del período.","Por la baja del bien por retiro, venta o deterioro."]},{"c":"1.2.01.09","n":"Equipos de Computación", s a Largo Plazo","d":"Registra las inversiones financieras de la cooperativa cuya realización o vencimiento se espera en un plazo superior a doce meses.","s":"Deudora","db":["Por la adquisición de la inversión financiera, al costo de compra."],"cr":["Por la venta, rescate o vencimiento de la inversión.","Por el reconocimiento de pérdidas por deterioro de valor."]},{"c":"2","n":"PASIVO","d":"","s":"","db":[],"cr":[]},{"c":"2.1","n":"PASIVO CORRIENTE","d":"","s":"","db":[],"cr":[]},{"c":"2.1.01","n":"CUENTAS POR PAGAR COMERCIALES","d":"","s":"","db":[],"cr":[]},{"c":"2.1.01.01","n":"Proveedores Pollitos BB","d":"Obligación de pago a corto plazo contraída con los proveedores de pollitos BB (baby broiler) adquiridos para el inicio de cada ciclo productivo avícola.","s":"Acreedora","db":["Pago total o parcial al proveedor de pollitos BB.","Notas de crédito por descuentos, bonificaciones o pollitos rechazados por incumplimiento sanitario.","Anulación de la obligación por error de registro."],"cr":["Recepción de los pollitos BB conforme a la orden de compra, con cargo al inventario 1.1.03.01.","Ajustes por diferencias de precio facturadas con posterioridad."]},{"c":"2.1.01.02","n":"Proveedores Alimento Balanceado (Comprado 2026)","d":"Obligación por pagar a proveedores por la compra de alimento balanceado terminado adquirido a terceros durante el ejercicio 2026, previo al inicio de la producción propia de la cooperativa.","s":"Acreedora","db":["Pagos efectuados al proveedor de alimento balanceado.","Notas de crédito por producto rechazado o en mal estado.","Descuentos o bonificaciones por volumen otorgados por el proveedor."],"cr":["Recepción del alimento balanceado, con cargo al inventario 1.1.03.02.","Reconocimiento de recargos o intereses por mora, si corresponde."]},{"c":"2.1.01.03","n":"Proveedores Materias Primas Alimento","d":"Obligaciones con proveedores de materias primas (maíz amarillo, torta de soya, afrecho de trigo, núcleo vitamínico, aceite vegetal) destinadas a la elaboración interna de alimento balanceado, de uso exclusivo a partir del ejercicio 2027.","s":"Acreedora","db":["Pago a los proveedores de materias primas.","Devoluciones por materia prima defectuosa o fuera de especificación técnica.","Descuentos comerciales obtenidos."],"cr":["Recepción de materias primas, con cargo a los inventarios 1.1.03.03 a 1.1.03.07.","Ajustes por variación de precio en compras pactadas a futuro."]},{"c":"2.1.01.04","n":"Proveedores Productos Veterinarios","d":"Obligaciones por la adquisición de vacunas, medicamentos y demás insumos veterinarios utilizados en la crianza y el manejo sanitario de las aves.","s":"Acreedora","db":["Pago al proveedor de productos veterinarios.","Devoluciones por producto vencido o defectuoso.","Descuentos comerciales obtenidos."],"cr":["Recepción de los productos veterinarios, con cargo al inventario 1.1.03.08.","Ajustes de precio facturados con posterioridad."]},{"c":"2.1.01.05","n":"Proveedores Insumos de Limpieza y Crianza","d":"Obligaciones por la compra de insumos de limpieza, desinfección y crianza empleados en el proceso productivo de la cooperativa.","s":"Acreedora","db":["Pago al proveedor correspondiente.","Devoluciones por insumos defectuosos o no conformes.","Descuentos comerciales obtenidos."],"cr":["Recepción de los insumos, con cargo a los inventarios 1.1.03.09 y 1.1.03.10.","Ajustes de precio posteriores a la recepción."]},{"c":"2.1.01.06","n":"Proveedores Servicios y Otros","d":"Obligaciones por servicios (transporte, energía eléctrica, mantenimiento, honorarios profesionales) y otros bienes distintos de los insumos productivos directos, necesarios para la operación de la cooperativa.","s":"Acreedora","db":["Pago del servicio o bien adquirido.","Notas de crédito por servicios no conformes o no prestados."],"cr":["Recepción o devengo del servicio o bien contratado.","Reconocimiento de intereses moratorios, si corresponde."]},{"c":"2.1.02","n":"OBLIGACIONES LABORALES CORTO PLAZO","d":"","s":"","db":[],"cr":[]},{"c":"2.1.02.01","n":"Sueldos y Salarios por Pagar","d":"Remuneraciones devengadas por el personal dependiente de la cooperativa (operarios y personal administrativo), pendientes de pago al cierre del período.","s":"Acreedora","db":["Pago de los sueldos al personal.","Ajustes por error en la planilla de remuneraciones."],"cr":["Devengamiento mensual del sueldo bruto según planilla, con cargo al costo de producción (sufijo 20) o al gasto administrativo, según el centro de trabajo del empleado."]},{"c":"2.1.02.02","n":"Aguinaldo por Pagar","d":"Provisión acumulada mensualmente del aguinaldo de navidad (equivalente a un mes de sueldo) a favor de los trabajadores estables, exigible al 31 de diciembre de cada año conforme a la legislación laboral boliviana.","s":"Acreedora","db":["Pago del aguinaldo devengado al 31 de diciembre.","Liquidación proporcional del aguinaldo al momento de la desvinculación del trabajador."],"cr":["Provisión mensual equivalente al 8,33% del salario bruto de cada trabajador estable (Política PC-09)."]},{"c":"2.1.02.03","n":"Aportes Patronales por Pagar","d":"Obligación por los aportes patronales a la Gestora Pública de la Seguridad Social de Largo Plazo (SSLP), equivalentes al 17,21% del salario bruto, devengados mensualmente sobre las remuneraciones del personal estable.","s":"Acreedora","db":["Pago mensual de los aportes patronales a la Gestora Pública."],"cr":["Devengamiento mensual del 17,21% sobre el salario bruto de cada trabajador (sufijo 38, Política PC-09)."]},{"c":"2.1.02.04","n":"Personal Eventual por Pagar","d":"Obligaciones con el personal contratado eventualmente por obra o servicio determinado (por ejemplo, faenado), no sujeto al régimen de beneficios sociales del personal estable.","s":"Acreedora","db":["Pago al personal eventual por las labores prestadas."],"cr":["Devengamiento del jornal o tarifa pactada por las labores prestadas (sufijo 22)."]},{"c":"2.1.02.05","n":"Aportes Laborales por Pagar","d":"Obligaciones con el personal contratado por obra o servicio determinado (por ejemplo, faenado)","s":"Acreedora","db":["cancelar o disminuir la deuda que la empresa tiene con las entidades gestoras o institución correspondiente, lo que reduce el pasivo."],"cr":["cuando nace o aumenta la obligación de la empresa de retener y pagar dichos aportes. Esto ocurre principalmente al cierre de cada mes, cuando se procesa la planilla de sueldos."]},{"c":"2.1.03","n":"OBLIGACIONES TRIBUTARIAS CORRIENTES","d":"","s":"","db":[],"cr":[]},{"c":"2.1.03.01","n":"Régimen Agropecuario Unificado por Pagar","d":"Obligación tributaria anual determinada bajo el Régimen Agropecuario Unificado (RAU), calculada en función de la extensión de la superficie productiva de la cooperativa, en sustitución del IVA, el IT y el IUE.","s":"Acreedora","db":["Pago de la alícuota anual del RAU al Servicio de Impuestos Nacionales."],"cr":["Devengamiento anual de la obligación tributaria conforme a la superficie productiva declarada."]},{"c":"2.1.03.02","n":"Tributos Municipales por Pagar","d":"Obligaciones devengadas por impuestos y tasas municipales (por ejemplo, Impuesto a la Propiedad de Bienes Inmuebles, patentes y tasas de aseo) a cargo del Gobierno Autónomo Municipal de Caranavi.","s":"Acreedora","db":["Pago del tributo municipal correspondiente."],"cr":["Devengamiento periódico del tributo conforme a la normativa municipal vigente."]},{"c":"2.1.04","n":"OTROS PASIVOS CORRIENTES","d":"","s":"","db":[],"cr":[]},{"c":"2.1.04.01","n":"Anticipos de Clientes HORECA Recibidos","d":"Importes cobrados por adelantado a clientes del segmento HORECA por productos aún no entregados, que no constituyen ingreso hasta la entrega física del bien conforme al principio de Realización (Política PC-08).","s":"Acreedora","db":["Reconocimiento del ingreso por venta al momento de la entrega del producto, aplicando el anticipo a la factura correspondiente.","Devolución del anticipo al cliente si la venta no llega a concretarse."],"cr":["Recepción de anticipos de clientes HORECA previos a la entrega del producto."]},{"c":"2.1.05","n":"EXCEDENTES POR DISTRIBUIR","d":"","s":"","db":[],"cr":[]},{"c":"2.1.05.01","n":"Excedentes por pagar Socios Ejercicio Anterior","d":"Obligación de la cooperativa con sus socios por la porción de excedentes del ejercicio anterior, aprobada por la Asamblea General para su distribución y aún pendiente de pago.","s":"Acreedora","db":["Pago efectivo a los socios del excedente que les fue asignado."],"cr":["Traslado del monto aprobado por la Asamblea General desde la cuenta patrimonial 3.1.03.04 Excedente en Distribución, una vez resuelta su distribución."]},{"c":"2.2","n":"PASIVO NO CORRIENTE","d":"","s":"","db":[],"cr":[]},{"c":"2.2.01","n":"OBLIGACIONES LABORALES LARGO PLAZO","d":"","s":"","db":[],"cr":[]},{"c":"2.2.01.01","n":"Provisión para Indemnización","d":"Pasivo estimado devengado que representa la obligación acumulada por indemnización por tiempo de servicios a favor del personal estable de la cooperativa, conforme a la Ley General del Trabajo (Política PC-09). La denominación \"Provisión\" corrige la terminología \"Previsión\" empleada en versiones preliminares del Plan de Cuentas, conforme al uso técnico-contable correcto del término como pasivo estimado devengado.","s":"Acreedora","db":["Pago de la indemnización al momento de la desvinculación del trabajador (liquidación final).","Ajustes por recálculo a la baja de la provisión."],"cr":["Provisión mensual equivalente al 8,33% del salario bruto de cada trabajador estable (sufijo 39, Política PC-09).","Recálculo al alza de la provisión ante incrementos salariales, con aplicación prospectiva."]},{"c":"3","n":"PATRIMONIO","d":"","s":"","db":[],"cr":[]},{"c":"3.1","n":"PATRIMONIO COOPERATIVO","d":"","s":"","db":[],"cr":[]},{"c":"3.1.01","n":"CAPITAL COOPERATIVO","d":"","s":"","db":[],"cr":[]},{"c":"3.1.01.01","n":"Certificados de Aportación Socios Fundadores","d":"Valor nominal de los certificados de aportación suscritos y pagados por los socios fundadores al momento de la constitución de la cooperativa, que constituye el capital social inicial de la entidad.","s":"Acreedora","db":["Retiro o exclusión de un socio fundador, con la consiguiente devolución de su aportación, conforme al estatuto y a la Ley General de Cooperativas (Ley N° 356).","Compensación de pérdidas acumuladas contra el capital, por decisión de la Asamblea General, en situaciones excepcionales."],"cr":["Suscripción y pago del certificado de aportación por cada socio fundador al constituirse la cooperativa.","Capitalización de excedentes o reservas por decisión de la Asamblea General."]},{"c":"3.1.01.02","n":"Certificados de Aportación Nuevos Socios","d":"Valor nominal de los certificados de aportación suscritos y pagados por los socios que se incorporan a la cooperativa con posterioridad a su constitución.","s":"Acreedora","db":["Retiro o exclusión del socio, con devolución de su aportación conforme al estatuto."],"cr":["Suscripción y pago del certificado de aportación por el nuevo socio admitido."]},{"c":"3.1.01.03","n":"Capital en Trámite de Registro","d":"Aportes de capital recibidos de socios cuyo registro formal ante la instancia competente se encuentra en trámite, pendiente de perfeccionamiento administrativo.","s":"Acreedora","db":["Reclasificación a la cuenta definitiva de Certificados de Aportación, una vez concluido el trámite de registro.","Devolución del aporte al socio si el trámite no llegara a perfeccionarse."],"cr":["Recepción del aporte de capital, pendiente de registro formal ante la instancia competente."]},{"c":"3.1.01.04","n":"Certificados de Aportación Suscritos","d":"Valor de los certificados de aportación suscritos por los socios que se encuentran pendientes de desembolso total o parcial.","s":"Acreedora","db":["Cobro efectivo de la porción pendiente de pago, con reclasificación a la cuenta de certificados pagados."],"cr":["Compromiso de suscripción formalizado por el socio, aun cuando el pago no se haya completado."]},{"c":"3.1.01.05","n":"Aportes Adicionales de Socios","d":"Aportes de capital adicionales a los certificados de aportación, efectuados voluntariamente por los socios para fortalecer el patrimonio de la cooperativa.","s":"Acreedora","db":["Devolución de aportes adicionales por decisión de la Asamblea General."],"cr":["Recepción de aportes adicionales voluntarios efectuados por los socios."]},{"c":"3.1.01.06","n":"Ajuste de Capital","d":"Cuenta patrimonial que registra el efecto acumulado de la reexpresión por inflación practicada sobre el Capital Cooperativo (Certificados de Aportación de Socios Fundadores, Nuevos Socios y Aportes Adicionales), conforme a la Norma de Contabilidad N° 3 (NC 3), destinada a mantener el poder adquisitivo del capital social aportado por los socios frente a los efectos de la inflación.","s":"Acreedora","db":["Capitalización del ajuste de capital acumulado, por decisión de la Asamblea General.","Aplicación del ajuste a la absorción de pérdidas extraordinarias, previa aprobación de la Asamblea General.","Reversiones o correcciones que disponga el CTNAC sobre el monto acumulado."],"cr":["Registro periódico del ajuste por inflación (reexpresión) sobre el saldo del Capital Cooperativo, conforme a la NC 3 y al Ajuste Integral por Inflación y Tenencia de Bienes (AITB), en los periodos en que dicho mecanismo se encuentre vigente."]},{"c":"3.1.02","n":"RESERVAS COOPERATIVAS","d":"","s":"","db":[],"cr":[]},{"c":"3.1.02.01","n":"Fondo de Reserva Legal","d":"Reserva de carácter obligatorio, constituida con un porcentaje de los excedentes netos de cada ejercicio conforme a la Ley General de Cooperativas (Ley N° 356) y el estatuto de la cooperativa, destinada a cubrir pérdidas futuras y fortalecer la solidez patrimonial.","s":"Acreedora","db":["Aplicación del fondo para absorber pérdidas (déficit) del ejercicio, previa decisión de la Asamblea General."],"cr":["Apropiación anual del porcentaje legal/estatutario sobre los excedentes netos del ejercicio."]},{"c":"3.1.02.02","n":"Fondo de Educación Cooperativa","d":"Reserva obligatoria destinada a financiar programas de educación, capacitación y formación cooperativa dirigidos a los socios y trabajadores, conforme a los principios cooperativos y la normativa sectorial boliviana.","s":"Acreedora","db":["Desembolsos aplicados a actividades de capacitación y educación cooperativa aprobadas por el órgano competente."],"cr":["Apropiación anual del porcentaje de excedentes destinado a este fondo, conforme a resolución de la Asamblea General."]},{"c":"3.1.02.03","n":"Reserva de Reinversión y Expansión","d":"Reserva voluntaria constituida con parte de los excedentes, destinada a financiar proyectos de reinversión y expansión de la capacidad productiva de la cooperativa (por ejemplo, nuevos galpones o la planta de alimento balanceado).","s":"Acreedora","db":["Capitalización de la reserva, o su liberación una vez concretado o desistido el proyecto de inversión que la originó."],"cr":["Apropiación de excedentes destinada a este fin específico, por decisión de la Asamblea General."]},{"c":"3.1.02.04","n":"Reserva Especial para Contingencias","d":"Reserva voluntaria constituida para cubrir contingencias futuras de naturaleza operativa, sanitaria o climática (por ejemplo, mortandad avícola anormal o eventos climáticos adversos propios de la región de los Yungas).","s":"Acreedora","db":["Aplicación de la reserva para cubrir la contingencia materializada, previa aprobación de la instancia competente."],"cr":["Apropiación de excedentes destinada a este fin, por decisión de la Asamblea General."]},{"c":"3.1.02.05","n":"Reserva por Revalúos Técnicos","d":"Reserva patrimonial que refleja el mayor valor resultante de la revalorización técnica de activos fijos (galpones, maquinaria), realizada por peritos independientes conforme a la NC-4, cuando el costo histórico resulte materialmente insuficiente para reflejar su valor económico real.","s":"Acreedora","db":["Reversión de la reserva por baja o disposición del activo revaluado.","Deterioro que revierta una revaluación previamente reconocida sobre el mismo activo."],"cr":["Reconocimiento del mayor valor determinado en la revalorización técnica de activos fijos, con pronunciamiento del Consejo de Vigilancia y aprobación de la Asamblea General."]},{"c":"3.1.02.06","n":"Ajuste de Reservas Patrimoniales","d":"Cuenta patrimonial que registra el efecto acumulado de la reexpresión por inflación practicada sobre las Reservas Cooperativas (Fondo de Reserva Legal, Fondo de Educación Cooperativa, Reserva de Reinversión y Expansión, Reserva Especial para Contingencias y Reserva por Revalúos), conforme a la Norma de Contabilidad N° 3 (NC 3), destinada a preservar el valor real de las reservas patrimoniales constituidas por la cooperativa.","s":"Acreedora","db":["Capitalización del ajuste de reservas acumulado, por decisión de la Asamblea General.","Aplicación del ajuste a la absorción de pérdidas (déficit) del ejercicio o restitución de reservas, conforme a la Ley General de Cooperativas (Ley N° 356) y decisión de la Asamblea General."],"cr":["Registro periódico del ajuste por inflación (reexpresión) sobre los saldos de las Reservas Cooperativas, conforme a la NC 3 y al Ajuste Integral por Inflación y Tenencia de Bienes (AITB), en los períodos en que dicho mecanismo se encuentre activo."]},{"c":"3.1.03","n":"RESULTADOS DE LA GESTIÓN","d":"","s":"","db":[],"cr":[]},{"c":"3.1.03.01","n":"Excedentes de Percepción Acumulados","d":"Cuenta que agrupa los excedentes netos de ejercicios anteriores no distribuidos ni destinados a reservas específicas, así como los efectos acumulados de ajustes de transición normativa (por ejemplo, adopción de NIIF, conforme a la Política PC-10).","s":"Acreedora","db":["Aplicación a la absorción de déficits acumulados de ejercicios anteriores.","Distribución posterior aprobada por la Asamblea General, o capitalización del monto."],"cr":["Traslado del Excedente del Ejercicio (3.1.03.02) no aplicado a reservas ni distribuido.","Reconocimiento de los ajustes acumulados por la adopción de nuevas normas (NIIF 1 Adopción por Primera Vez), conforme a la Política PC-10."]},{"c":"3.1.03.02","n":"Excedente del Ejercicio","d":"Resultado positivo (excedente neto) obtenido por la cooperativa durante el ejercicio fiscal en curso, determinado como la diferencia entre los ingresos y los costos/gastos del período conforme al Estado de Resultados (Política PC-08).","s":"Acreedora","db":["Cierre del resultado al finalizar el ejercicio, con traslado a distribución de excedentes, a reservas o a excedentes acumulados, según decisión de la Asamblea General."],"cr":["Determinación del excedente neto positivo al cierre del ejercicio fiscal (30 de junio)."]},{"c":"3.1.03.03","n":"Déficit del Ejercicio","d":"Resultado negativo obtenido por la cooperativa durante el ejercicio fiscal, cuando los costos y gastos superan a los ingresos operativos del período.","s":"Deudora","db":["Determinación del déficit neto al cierre del ejercicio fiscal (30 de junio)."],"cr":["Absorción del déficit contra el Fondo de Reserva Legal, otras reservas o excedentes acumulados, según decisión de la Asamblea General."]},{"c":"3.1.03.04","n":"Excedente en Distribución Decisión Asamblea","d":"Porción del excedente del ejercicio cuya distribución a los socios ha sido aprobada formalmente por la Asamblea General, pendiente de traslado a la obligación de pago correspondiente.","s":"Acreedora","db":["Traslado del monto aprobado hacia el pasivo 2.1.05.01 Excedentes por pagar Socios, una vez formalizada la distribución."],"cr":["Asignación del Excedente del Ejercicio (3.1.03.02) destinada a distribución, conforme a resolución de la Asamblea General."]},{"c":"3.1.04","n":"APORTES ESPECIALES Y DONACIONES","d":"","s":"","db":[],"cr":[]},{"c":"3.1.04.01","n":"Primas de Admisión","d":"Importes que, conforme al estatuto de la cooperativa, deben cancelar los nuevos socios al momento de su ingreso, adicionales al valor de los certificados de aportación, destinados a compensar el mayor valor patrimonial acumulado por la entidad.","s":"Acreedora","db":["Devolución excepcional de la prima de admisión, cuando el estatuto lo contempla, ante el retiro del socio dentro de los plazos determinados."],"cr":["Cobro de la prima de admisión al momento de la incorporación de un nuevo socio."]},{"c":"3.1.04.02","n":"Donaciones y Legados","d":"Recursos recibidos por la cooperativa a título gratuito, provenientes de donaciones o legados de terceros (personas naturales, jurídicas o entidades de cooperación), sin contraprestación ni obligación de devolución, destinados a fortalecer el patrimonio institucional.","s":"Acreedora","db":["Aplicación de la donación a la finalidad específica establecida por el donante, con traslado a la cuenta patrimonial o de resultados que corresponda.","Devolución de la donación si no se cumplen las condiciones impuestas por el donante."],"cr":["Reconocimiento de la donación o legado recibido, a su valor razonable en la fecha de recepción, aplicando de forma supletoria las NIIF ante la ausencia de un pronunciamiento técnico específico de las NCGA."]},{"c":"4","n":"REGULADORAS DE ACTIVO","d":"","s":"","db":[],"cr":[]},{"c":"4.1","n":"REGULADORAS DE ACTIVO CORRIENTE","d":"","s":"","db":[],"cr":[]},{"c":"4.1.01","n":"ACTIVO CORRIENTE","d":"Cuenta reguladora de activo de naturaleza compensatoria que registra el importe estimado de las pérdidas esperadas por incobrabilidad de las cuentas por cobrar comerciales y deudores varios de la Cooperativa, ajustando el valor bruto de la cartera al importe recuperable estimado.","s":"Acreedora","db":["El castigo directo de cuentas por cobrar declaradas incobrables tras agotar las gestiones de cobro.","La reversión o ajuste por exceso en la estimación del deterioro determinada al cierre del ejercicio."],"cr":["El reconocimiento o incremento del deterioro estimado de la cartera al cierre del ejercicio, con cargo a la cuenta de gasto del período.","El ajuste por deterioro de nuevas cuentas por cobrar surgidas de operaciones excepcionales a crédito con asociados."]},{"c":"4.1.01.02","n":"Deterioro Acumulado de Materias Primas","d":"Cuenta reguladora de activo que registra la pérdida de valor estimada de las materias primas (pollitos BB, alimento balanceado comprado o producido, granos y núcleos) mantenidas en almacén, cuando su valor neto de realización es inferior a su costo de adquisición o producción, por obsolescencia, vencimiento o deterioro físico propio de insumos perecederos en el clima de Caranavi.","s":"Acreedora","db":["La baja definitiva de materias primas deterioradas, vencidas o inservibles previamente provisionadas.","La reversión del deterioro cuando el valor neto de realización se recupera antes de la baja del inventario."],"cr":["El reconocimiento del deterioro estimado al cierre del ejercicio, cuando el costo registrado excede el valor neto de realización.","Los ajustes por mermas anormales de granos o núcleos detectadas en verificaciones físicas de almacén."]},{"c":"4.1.01.03","n":"Deterioro Acumulado de Alimento Balanceado","d":"Cuenta reguladora de activo que registra la pérdida estimada de valor del inventario de alimento balanceado terminado (adquirido a terceros o, a partir de 2027, producido en planta propia) destinado al consumo de las aves o a la venta del excedente, cuando su valor neto de realización cae por debajo del costo registrado debido a descomposición, contaminación o pérdida de valor nutricional.","s":"Acreedora","db":["La baja del inventario de alimento balanceado deteriorado o vencido previamente provisionado.","La reversión del deterioro cuando desaparecen las causas que lo originaron.","La baja del producto terminado deteriorado o no apto para la venta, previamente provisionado.","La reversión del deterioro cuando el producto recupera condiciones de venta antes de su baja."],"cr":["El reconocimiento del deterioro al cierre del ejercicio cuando el valor neto de realización es inferior al costo registrado.","Los ajustes derivados de contaminación, humedad o vencimiento detectados en el excedente destinado a venta.","El reconocimiento del deterioro al cierre del ejercicio cuando el valor neto de realización cae por debajo del costo de producción por lote.","Los ajustes por rotura de cadena de frío o excedentes de producción sin colocación oportuna en el mercado."]},{"c":"4.1.02","n":"ACTIVO NO CORRIENTE","d":"Cuenta reguladora de activo que acumula el desgaste sistemático del costo de los galpones destinados a la crianza de pollos en la Provincia Caranavi, distribuyendo dicho costo a lo largo de su vida útil legal en función del uso continuo por lotes sucesivos de 1.000 aves.","s":"Acreedora","db":["La baja de la depreciación acumulada al momento de la venta, retiro o siniestro del galpón.","El ajuste por reversión cuando corresponda un cambio de estimación en la vida útil.","La baja de la depreciación acumulada al retiro, reposición o siniestro del alambrado.","El ajuste por cambio de estimación en la vida útil restante.","La baja de la depreciación acumulada al retiro o siniestro del ambiente.","El ajuste por cambio de estimación en la vida útil restante."],"cr":["El cargo periódico (mensual) de la depreciación calculada por el método de línea recta, con débito a la cuenta de costo o gasto correspondiente.","Los ajustes por revalorización técnica del activo cuando corresponda actualizar la base depreciable.","El cargo periódico de la depreciación por línea recta, con débito al costo o gasto del centro correspondiente.","Los ajustes por mantenimiento mayor que extiende la vida útil, cuando así lo determine la política interna.","El cargo periódico de la depreciación por línea recta a partir de la habilitación del ambiente para uso productivo (planta propia 2027), con débito al CIF de Alimento Balanceado.","Los ajustes técnicos por revalorización cuando corresponda."]},{"c":"4.3","n":"REGULADORAS DE PATRIMONIO","d":"","s":"","db":[],"cr":[]},{"c":"4.3.01","n":"REGULADORAS DE CAPITAL COOPERATIVO","d":"Cuenta reguladora de patrimonio de naturaleza compensatoria que registra la porción del capital social cooperativo suscrito por los asociados de Pollolandia R.L. que aún no ha sido efectivamente desembolsada, conforme a los Estatutos y la política de aportaciones de la Cooperativa (POL-01).","s":"Deudora","db":["El monto de los certificados de aportación suscritos por los asociados al momento de su ingreso o de una ampliación de capital, pendientes de pago.","Los ajustes por nuevas suscripciones de certificados no pagados en el ejercicio."],"cr":["El pago efectivo, total o parcial, de los certificados de aportación suscritos por los asociados.","La compensación de certificados no pagados contra excedentes u otros derechos económicos del asociado, cuando lo autoricen los Estatutos."]},{"c":"5","n":"INGRESOS","d":"","s":"","db":[],"cr":[]},{"c":"5.1","n":"INGRESOS OPERATIVOS","d":"","s":"","db":[],"cr":[]},{"c":"5.1.01","n":"VENTAS – CARNE DE POLLO","d":"","s":"","db":[],"cr":[]},{"c":"5.1.01.01","n":"Ventas – Carne de pollo","d":"Registra los ingresos generados por la venta de carne de pollo de ciclo natural (73 días), producto principal de la cooperativa, comercializado bajo el sello \"Vida Digna\" a los mercados HORECA, familiar y popular de la región de los Yungas.","s":"Acreedora","db":["Por el cierre del ejercicio, mediante la regularización (cancelación) del saldo acumulado contra la cuenta de Resumen de Déficit y excedentes (Grupo 8 — Otras Cuentas de Resultado).","Por la anulación íntegra del ingreso reconocido, cuando se produce el rechazo del producto por el cliente debido a incumplimiento de los estándares de calidad e inocuidad, en el mismo período en que ocurre el rechazo."],"cr":["Por la entrega física del producto al cliente —en granja, en frial de distribución o en el establecimiento HORECA—, momento en el cual el cliente asume los riesgos y beneficios del bien.","Por el reconocimiento del ingreso una vez que su importe está determinado y su cobro es probable, en el marco de la política institucional de venta al contado (POL-05)."]},{"c":"5.1.02","n":"VENTAS – ALIMENTO BALANCEADO","d":"","s":"","db":[],"cr":[]},{"c":"5.1.02.01","n":"Ventas – Alimento Balanceado Excedente","d":"Registra los ingresos generados por la venta a terceros del alimento balanceado excedente elaborado internamente por la cooperativa. Cuenta de uso exclusivo a partir del ejercicio 2027.","s":"Acreedora","db":["Por el cierre del ejercicio, mediante la regularización (cancelación) del saldo acumulado contra la cuenta de Resumen de déficit y excedentes (Grupo 8 — Otras Cuentas de Resultado).","Por la anulación del ingreso reconocido, en caso de rechazo del producto por el comprador."],"cr":["Por la entrega del saco de alimento balanceado al comprador, momento de reconocimiento del ingreso conforme a la Política Contable PC-08.","Por el reconocimiento del importe de la venta, una vez determinado y de cobro probable."]},{"c":"5.1.03","n":"REGULADORAS DE INGRESOS OPERATIVOS","d":"","s":"","db":[],"cr":[]},{"c":"5.1.03.01","n":"Devoluciones en Ventas","d":"Cuenta reguladora (de valuación) de los ingresos operativos que registra la anulación de ventas de carne de pollo o de alimento balanceado por rechazo del producto derivado del incumplimiento de estándares de calidad e inocuidad.","s":"Deudora","db":["Por el reconocimiento de la devolución en el período en que se produce el rechazo del producto por incumplimiento de estándares de calidad, con reingreso del bien devuelto al inventario de productos terminados a su costo de producción."],"cr":["Por el cierre del ejercicio, mediante la regularización del saldo contra el ingreso operativo bruto o contra la cuenta de Resumen de déficit y excedentes (Grupo 8), disminuyendo el ingreso operativo neto del período.","Por correcciones o reclasificaciones de la devolución debidamente autorizadas por la Gerencia General."]},{"c":"5.2","n":"INGRESOS NO OPERATIVOS","d":"","s":"","db":[],"cr":[]},{"c":"5.2.01","n":"OTROS INGRESOS","d":"","s":"","db":[],"cr":[]},{"c":"5.2.01.01","n":"Ingresos Financieros – Intereses Ganados","d":"Registra los ingresos generados por los intereses devengados sobre los saldos mantenidos por la cooperativa en su cuenta de ahorros bancaria.","s":"Acreedora","db":["Por el cierre del ejercicio, mediante la regularización (cancelación) del saldo acumulado contra la cuenta de Resumen de déficit y excedentes (Grupo 8 — Otras Cuentas de Resultado)."],"cr":["Por el devengamiento mensual de los intereses ganados sobre la cuenta de ahorros, con independencia de su acreditación efectiva por el banco, conforme al principio de Devengado (NC-1).","Por la acreditación efectiva de los intereses por parte de la entidad bancaria."]},{"c":"5.2.01.02","n":"Donaciones y Subsidios Recibidos","d":"Registra el valor de las donaciones en efectivo o en especie y de los subsidios recibidos por la cooperativa de organismos de cooperación, entidades públicas u otros terceros.","s":"Acreedora","db":["Por el cierre del ejercicio, mediante la regularización (cancelación) del saldo acumulado contra la cuenta de Resumen de déficit y excedentes (Grupo 8 — Otras Cuentas de Resultado).","Por la anulación del ingreso reconocido, cuando la donación o el subsidio estaba condicionado y la cooperativa no cumple con las condiciones asociadas."],"cr":["Por la recepción efectiva de la donación o subsidio, o cuando exista certeza razonable de su recepción y del cumplimiento de las condiciones asociadas a la misma."]},{"c":"5.2.01.03","n":"Recuperación de Gastos de Ejercicios Anteriores","d":"Registra los ingresos originados en la recuperación de gastos o pérdidas reconocidos en ejercicios anteriores (reembolsos, indemnizaciones de seguros, correcciones a favor de la cooperativa, entre otros).","s":"Acreedora","db":["Por el cierre del ejercicio, mediante la regularización (cancelación) del saldo acumulado contra la cuenta de Resumen de déficit y excedentes (Grupo 8 — Otras Cuentas de Resultado).","Por la corrección o anulación de la recuperación reconocida, en caso de error en su determinación."],"cr":["Por la determinación del derecho de cobro o la recepción efectiva del reembolso o indemnización correspondiente a un gasto reconocido en un ejercicio anterior."]},{"c":"5.2.01.04","n":"Ventas – Gallinaza / Abono Orgánico","d":"Registra los ingresos generados por la venta del subproducto orgánico (gallinaza) obtenido del proceso de crianza avícola, reconocido como ingreso no operativo dentro del Estado de Resultados escalonado de la cooperativa.","s":"Acreedora","db":["Por el cierre del ejercicio, mediante la regularización (cancelación) del saldo acumulado contra la cuenta de Resumen de déficit y excedentes (Grupo 8 — Otras Cuentas de Resultado)."],"cr":["Por la carga y retiro del subproducto por el comprador, momento de reconocimiento del ingreso, generalmente coincidente con el cierre de cada ciclo productivo, conforme a la Política Contable PC-08."]},{"c":"5.2.01.05","n":"Otros Ingresos No Operativos","d":"Registra otros ingresos de naturaleza no operativa no comprendidos en las cuentas específicas del Grupo 5, tales como la ganancia por venta o retiro de activos fijos u otros ingresos eventuales.","s":"Acreedora","db":["Por el cierre del ejercicio, mediante la regularización (cancelación) del saldo acumulado contra la cuenta de Resumen de deficit y excedentes (Grupo 8 — Otras Cuentas de Resultado).","Por la corrección de partidas registradas erróneamente en esta cuenta que correspondan a otro rubro."],"cr":["Por el reconocimiento de una ganancia en la disposición de activos fijos (diferencia positiva entre el importe obtenido y el valor neto en libros del bien, conforme a la Política Contable PC-05).","Por otros ingresos eventuales no operativos no clasificables en una cuenta específica."]},{"c":"6","n":"COSTOS OPERATIVOS DE PRODUCCIÓN","d":"","s":"","db":[],"cr":[]},{"c":"6.1","n":"COSTOS OPERATIVOS DE PRODUCCIÓN","d":"","s":"","db":[],"cr":[]},{"c":"6.1.01","n":"CENTROS DE COSTO – PRODUCCIÓN EN PROCESO","d":"Cuenta de Producción en Proceso que acumula, bajo un sistema de costeo por lote u orden de producción (lotes de 1.000 aves, ciclo biológico-productivo de 73 días), los tres elementos del costo — materia prima (pollitos BB, alimento balanceado, insumos veterinarios y de crianza), mano de obra directa e indirecta (encargado fijo con distribución del 75% a este centro, más mano de obra eventual por destajo para faenado) y costos indirectos de fabricación (depreciaciones, mantenimiento, energía y previsiones sociales) — hasta el traslado del costo total a Productos Terminados – Carne de Pollo al cierre del lote.","s":"Deudora","db":[],"cr":[]},{"c":"6.1.01.01","n":"Centro de Costo – Producción de Carne de Pollo","d":"Activo transitorio acumulador del costo del ciclo de 73 días. Se mueve únicamente por sufijo; al cierre del ciclo se transfiere a 1.1.03.12. Cuenta definida en el Manual del Sistema de Costos; no figura en el documento «Descripción de Cuentas».","s":"Deudora","db":[],"cr":[]},{"c":"6.1.01.02","n":"Centro de Costo – Producción de Alimento Balanceado","d":"Activo transitorio acumulador del costo del alimento balanceado (desde 2027). Se mueve únicamente por sufijo. Cuenta definida en el Manual del Sistema de Costos; no figura en el documento «Descripción de Cuentas».","s":"Deudora","db":[],"cr":[]},{"c":"6.1.02","n":"COSTO DE VENTAS","d":"","s":"","db":[],"cr":[]},{"c":"6.1.02.01","n":"Costo de Ventas – Carne de Pollo","d":"Costo de las unidades vendidas, con crédito a 1.1.03.12. Cuenta definida en el Manual del Sistema de Costos; no figura en el documento «Descripción de Cuentas».","s":"Deudora","db":[],"cr":[]},{"c":"6.1.02.02","n":"Costo de Ventas – Alimento Balanceado Excedente","d":"Costo del alimento excedente vendido, con crédito a 1.1.03.13. Cuenta definida en el Manual del Sistema de Costos; no figura en el documento «Descripción de Cuentas».","s":"Deudora","db":[],"cr":[]},{"c":"7","n":"GASTOS","d":"","s":"","db":[],"cr":[]},{"c":"7.1.01","n":"GASTOS DE PERSONAL ADMINISTRATIVO","d":"","s":"","db":[],"cr":[]},{"c":"7.1.01.01","n":"Sueldos – Gerencia General y Administración","d":"Cuenta que registra la remuneración mensual devengada por el personal de Gerencia General y del área administrativa de la cooperativa, en contraprestación por los servicios prestados en el ejercicio de sus funciones directivas y de gestión.","s":"Deudora","db":["El devengamiento mensual del sueldo del personal de Gerencia General y administración.","Los ajustes o incrementos salariales aprobados durante el ejercicio."],"cr":["El cierre del gasto contra la cuenta de Resumen de déficit y excedentes al finalizar el período."]},{"c":"7.1.01.02","n":"Aguinaldo – Personal Administrativo","d":"Registra la provisión mensual del beneficio social de aguinaldo de navidad correspondiente al personal administrativo estable, equivalente a un mes de sueldo que se devenga progresivamente durante el año.","s":"Deudora","db":["La provisión mensual equivalente al 8,33% del salario bruto del personal administrativo (política PC-09).","Los ajustes derivados de incrementos salariales durante el ejercicio."],"cr":["El cierre del gasto contra resultados al final del ejercicio, con contrapartida en el pasivo por aguinaldo devengado."]},{"c":"7.1.01.03","n":"Beneficios Sociales – Personal Administrativo","d":"Registra los aportes patronales que la cooperativa efectúa a la Gestora Pública de la Seguridad Social de Largo Plazo por cuenta del personal administrativo, como carga social obligatoria sobre el salario.","s":"Deudora","db":["El devengamiento mensual del aporte patronal equivalente al 17,21% sobre el salario bruto del personal administrativo (PC-09)."],"cr":["El cierre del gasto contra resultados al final del ejercicio."]},{"c":"7.1.01.04","n":"Indemnización – Personal Administrativo","d":"Registra la provisión mensual por indemnización por tiempo de servicios del personal administrativo estable, en cumplimiento de la Ley General del Trabajo, equivalente a un mes de sueldo por año trabajado.","s":"Deudora","db":["La provisión mensual equivalente al 8,33% del salario bruto (1/12 del sueldo mensual), según PC-09."],"cr":["El cierre del gasto contra resultados; disminuye la provisión cuando se cancela la liquidación final, con contrapartida en la cuenta de pasivo 2.2.01.01 – Provisión para Indemnización."]},{"c":"7.1.02","n":"GASTOS GENERALES ADMINISTRATIVOS","d":"","s":"","db":[],"cr":[]},{"c":"7.1.02.01","n":"Materiales y Útiles de Oficina","d":"Agrupa el consumo de suministros y útiles de oficina (papelería, insumos de impresión y otros consumibles) utilizados por la administración de la cooperativa.","s":"Deudora","db":["La adquisición y/o el consumo de materiales y útiles de oficina durante el período."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.1.02.02","n":"Servicios de Comunicación (Telefonía / Internet)","d":"Registra el gasto por los servicios de telefonía e internet contratados para el funcionamiento administrativo de la cooperativa.","s":"Deudora","db":["El devengamiento mensual del servicio facturado por el proveedor."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.1.02.03","n":"Gastos de Mantenimiento – Administrativos","d":"Registra los gastos incurridos en el mantenimiento y reparación de bienes muebles e inmuebles de uso administrativo que no constituyen mejoras capitalizables.","s":"Deudora","db":["Los servicios de mantenimiento y reparación devengados durante el período."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.1.02.04","n":"Depreciación Muebles y Enseres","d":"Registra la cuota mensual de depreciación de los muebles y enseres de oficina asignados al área administrativa de la cooperativa.","s":"Deudora","db":["La cuota mensual de depreciación calculada por el método de línea recta, sobre una vida útil de 10 años (tasa anual 10,00%), según PC-06."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio, con contrapartida en la cuenta reguladora de depreciación acumulada del activo."]},{"c":"7.1.02.05","n":"Depreciación Equipos de Computación","d":"Registra la cuota mensual de depreciación de los equipos de cómputo asignados al área administrativa de la cooperativa.","s":"Deudora","db":["La cuota mensual de depreciación calculada por el método de línea recta, sobre una vida útil de 4 años (tasa anual 25,00%), según PC-06."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio, con contrapartida en la cuenta reguladora de depreciación acumulada del activo."]},{"c":"7.1.02.06","n":"Amortización Gastos de Constitución","d":"Registra la amortización sistemática del activo intangible Gastos de Constitución (cuenta 1.2.02.01), correspondiente a los desembolsos incurridos en la conformación legal de la cooperativa.","s":"Deudora","db":["La cuota anual de amortización del activo intangible, con crédito a la cuenta reguladora 4.1.02.09 (PC-06)."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.1.02.07","n":"Amortización Software y Plataformas Digitales","d":"Registra la amortización sistemática del activo intangible Software y Plataformas Digitales (cuenta 1.2.02.02), utilizado en la gestión administrativa y de comercialización de la cooperativa.","s":"Deudora","db":["La cuota anual de amortización del activo intangible, con crédito a la cuenta reguladora 4.1.02.10 (PC-06)."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.1.02.08","n":"Pérdida en Cuentas Incobrables","d":"Registra la estimación o el reconocimiento de la pérdida por incobrabilidad de cuentas por cobrar cuya recuperación se considera remota, en aplicación del principio de Prudencia.","s":"Deudora","db":["La constitución de la estimación o el castigo directo de cuentas por cobrar consideradas incobrables (principio de Prudencia, NC-1 NCGA)."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio.","La reversión, en caso de que la cuenta previamente estimada como incobrable sea efectivamente recuperada."]},{"c":"7.1.03","n":"GASTOS DE COMERCIALIZACIÓN","d":"","s":"","db":[],"cr":[]},{"c":"7.1.03.01","n":"Gastos de Transporte y Flete Rural","d":"Registra los costos de transporte y flete incurridos para la distribución y comercialización de la carne de pollo desde la granja hacia los puntos de entrega (frial de distribución, establecimientos HORECA).","s":"Deudora","db":["El flete y transporte devengado en cada operación de distribución y venta del producto terminado."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.1.03.02","n":"Gastos de Embalaje y Presentación del Producto","d":"Registra el consumo de materiales y servicios de embalaje y presentación comercial del producto terminado destinados a la venta, diferenciados de los insumos de embalaje que forman parte del costo de producción.","s":"Deudora","db":["El consumo de materiales de embalaje y presentación comercial utilizados en la etapa de venta y distribución."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.1.04","n":"GASTOS DE CERTIFICACIÓN Y CALIDAD","d":"","s":"","db":[],"cr":[]},{"c":"7.1.04.01","n":"Certificación SENASAG","d":"Registra los gastos incurridos para la obtención y el mantenimiento de la certificación sanitaria del Servicio Nacional de Sanidad Agropecuaria e Inocuidad Alimentaria (SENASAG), requerida para la comercialización de carne de pollo.","s":"Deudora","db":["El pago o devengamiento de tasas y trámites vinculados a la certificación sanitaria SENASAG."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.1.04.02","n":"Auditoría y Certificación IBNORCA","d":"Registra los gastos de auditoría y certificación de calidad ante el Instituto Boliviano de Normalización y Calidad (IBNORCA), vinculados al sello de calidad e inocuidad del producto.","s":"Deudora","db":["El pago o devengamiento de honorarios de auditoría y tasas de certificación IBNORCA."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.1.05","n":"GASTOS LEGALES Y DE REGISTRO","d":"","s":"","db":[],"cr":[]},{"c":"7.1.05.01","n":"Licencias Municipales y Habilitación","d":"Registra el gasto por licencias de funcionamiento, habilitación municipal y otros permisos legales requeridos para la operación de la cooperativa.","s":"Deudora","db":["El pago o devengamiento de tasas por licencias municipales y trámites de habilitación."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.2.01","n":"GASTOS FINANCIEROS Y EXTRAORDINARIOS","d":"","s":"","db":[],"cr":[]},{"c":"7.2.01.01","n":"Multas y Sanciones","d":"Registra las sanciones pecuniarias impuestas a la cooperativa por incumplimiento de disposiciones legales, tributarias, laborales o municipales.","s":"Deudora","db":["El reconocimiento de la multa o sanción notificada a la cooperativa."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.2.01.02","n":"Pérdida por Retiro o Venta de Activos Fijos","d":"Registra la pérdida resultante de la diferencia entre el valor neto en libros de un activo fijo dado de baja por retiro o venta y su valor de realización, cuando este último es menor (PC-06).","s":"Deudora","db":["La diferencia negativa entre el valor neto en libros del activo retirado o vendido y su valor de realización."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.2.01.03","n":"Gastos Extraordinarios No Previstos","d":"Registra erogaciones de naturaleza no recurrente y ajenas a la actividad ordinaria de la cooperativa, no contempladas en el presupuesto operativo del ejercicio.","s":"Deudora","db":["El reconocimiento del gasto extraordinario en el momento en que ocurre el hecho que lo origina."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.2.01.04","n":"Pérdidas por Mortandad Avícola Anormal","d":"Registra el costo de las aves fallecidas durante el ciclo productivo que excede el umbral del 5% de la producción total considerado normal, reconocido como gasto no operativo del período (PC-08).","s":"Deudora","db":["El costo proporcional de la mortandad avícola que excede el 5% de la producción total del ciclo, previamente acumulado en el sufijo 40 del centro de costos 6.1.01.01."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"7.2.01.05","n":"Pérdidas por Mermas de Producción Anormal","d":"Registra las mermas de alimento balanceado —diferencia entre el consumo registrado y el consumo real verificado en inventario físico— que exceden el 5% considerado normal, tratadas como gasto no operativo del período (PC-08).","s":"Deudora","db":["El costo de la merma de alimento balanceado que excede el 5% normal, previamente acumulado en el sufijo 41 del centro de costos 6.1.01.02."],"cr":["El cierre del gasto contra resultados al finalizar el ejercicio."]},{"c":"8","n":"OTRAS CUENTAS DE RESULTADO","d":"","s":"","db":[],"cr":[]},{"c":"8.1","n":"RESUMEN DE PÉRDIDAS Y GANANCIAS","d":"","s":"","db":[],"cr":[]},{"c":"8.1.01","n":"RESUMEN DE RESULTADOS","d":"","s":"","db":[],"cr":[]},{"c":"8.1.01.01","n":"Resumen de Déficit y Excedentes del Ejercicio","d":"Cuenta transitoria de cierre contable utilizada para concentrar, al finalizar el ejercicio fiscal (1 de julio al 30 de junio), los saldos de todas las cuentas de Ingresos Operativos, Costos de Producción y Gastos Operativos, con el fin de determinar el resultado neto del período (excedente o déficit) antes de su traslado a las cuentas patrimoniales, conforme al procedimiento de determinación del Excedente Distribuible establecido en la Política de Distribución de Excedentes Cooperativos (POL-01).","s":"Dual y transitoria: se comporta como deudora mientras recibe el traslado de los saldos de costos y gastos, y como acreedora mientras recibe el traslado de los saldos de ingresos; al cierre del proceso contable su saldo neto (excedente o déficit) se traslada íntegramente a la cuenta patrimonial correspondiente, quedando la cuenta saldada en cero.","db":["El traslado de los saldos deudores de las cuentas de Costos de Producción (Grupo 6) y de Gastos Operativos al cierre del ejercicio fiscal.","El traslado del déficit del ejercicio a la cuenta patrimonial de resultados, cuando los costos y gastos totales superan a los ingresos operativos totales."],"cr":["El traslado de los saldos acreedores de las cuentas de Ingresos Operativos: venta de carne de pollo, venta de alimento balanceado excedente y venta de gallinaza.","El traslado del excedente neto del ejercicio (Ingresos Operativos Totales – Costos de Producción – Gastos Operativos, conforme al Art. 1 de POL-01) a la cuenta patrimonial de Excedentes del Ejercicio, previo a la aplicación de la Reserva Legal (mínimo 5%), el Fondo de Educación Cooperativa (mínimo 1%) y la Reserva de Reinversión y Expansión."]},{"c":"8.2","n":"AJUSTE Y REEXPRESIONES","d":"","s":"","db":[],"cr":[]},{"c":"8.2.01","n":"RESULTADO POR EXPOSICIÓN A VARIABLES MONETARIAS","d":"","s":"","db":[],"cr":[]},{"c":"8.2.01.01","n":"REI – Resultado por Exposición a la Inflación","d":"Cuenta de resultado no operativo que registra la ganancia o pérdida que genera, sobre las partidas monetarias (activas y pasivas) de la cooperativa, la pérdida de poder adquisitivo de la moneda durante el ejercicio, medida a través de la variación de la Unidad de Fomento de Vivienda (UFV), conforme a la metodología de ajuste por inflación de las NCGA de Bolivia y sujeta a la determinación periódica del CTNAC del CAUB sobre la procedencia de practicar dicho ajuste en función de la inflación acumulada del período.","s":"Dual: deudora cuando las partidas monetarias activas (disponible, cuentas por cobrar) superan a las pasivas y se genera una pérdida por exposición a la inflación; acreedora cuando las partidas monetarias pasivas superan a las activas y se genera una ganancia por exposición a la inflación.","db":["El resultado por exposición a la inflación (pérdida) cuando el neto de partidas monetarias activas excede al de partidas monetarias pasivas al cierre del ejercicio.","El ajuste determinado mediante la aplicación de la variación porcentual de la UFV entre el inicio y el cierre del período sobre dicho neto de partidas monetarias."],"cr":["El resultado por exposición a la inflación (ganancia) cuando el neto de partidas monetarias pasivas excede al de partidas monetarias activas al cierre del ejercicio.","El traslado del saldo (ganancia) a la cuenta 8.1.01.01 – Resumen de Déficit y Excedentes del Ejercicio, dentro del proceso de cierre contable."]},{"c":"8.2.01.02","n":"AITB – Ajuste por Inflación y Tenencia de Bienes","d":"Cuenta de resultado no operativo que refleja el efecto combinado de la inflación general y el mantenimiento de activos no monetarios (inventarios y propiedad, planta y equipo) durante el ejercicio, es decir, la diferencia entre la actualización específica de dichos bienes y su ajuste por la sola inflación general, conforme a la metodología integral de ajuste por inflación de las NCGA de Bolivia.","s":"Dual: deudora cuando se genera una pérdida por tenencia de bienes (la actualización de los activos no monetarios resulta inferior a la inflación general del período); acreedora cuando se genera una ganancia por tenencia de bienes (la actualización resulta superior a la inflación general).","db":["La pérdida por tenencia de bienes cuando la actualización de los activos no monetarios (inventario de pollitos BB, alimento e insumos, y propiedad, planta y equipo) resulta inferior a la inflación general del período.","Los ajustes de reexpresión que disminuyen el resultado por tenencia respecto al costo histórico actualizado únicamente por inflación general."],"cr":["La ganancia por tenencia de bienes cuando la actualización de los activos no monetarios supera a la inflación general del período.","El traslado del saldo neto (ganancia) a la cuenta 8.1.01.01 – Resumen de Déficit y Excedentes del Ejercicio al cierre contable."]},{"c":"8.2.02","n":"DIFERENCIAS DE CAMBIO","d":"","s":"","db":[],"cr":[]},{"c":"8.2.02.01","n":"Diferencias de Cambio","d":"Cuenta de resultado no operativo que registra las ganancias o pérdidas originadas por la fluctuación del tipo de cambio oficial entre el Boliviano y la moneda extranjera, aplicable a las partidas en moneda extranjera que mantiene la cooperativa, principalmente los saldos de la cuenta 1.1.01.02 – Caja – Efectivo en Moneda Extranjera.","s":"Dual: deudora cuando se genera una pérdida cambiaria (el tipo de cambio de cierre es menor al de registro original de la partida); acreedora cuando se genera una ganancia cambiaria (el tipo de cambio de cierre es mayor al de registro original).","db":["La pérdida cambiaria resultante de actualizar, al tipo de cambio oficial de cierre, los saldos en moneda extranjera, cuando dicho tipo de cambio es menor al de registro original.","Las diferencias de cambio realizadas al efectuar cobros o pagos en moneda extranjera a un tipo de cambio menor al de registro original de la partida."],"cr":["La ganancia cambiaria resultante de actualizar los saldos en moneda extranjera al tipo de cambio oficial de cierre, cuando dicho tipo de cambio es mayor al de registro original.","Las diferencias de cambio realizadas al efectuar cobros o pagos en moneda extranjera a un tipo de cambio mayor al de registro original de la partida."]},{"c":"9","n":"CUENTAS DE ORDEN","d":"","s":"","db":[],"cr":[]},{"c":"9.1","n":"CUENTAS DE ORDEN DEUDORAS","d":"","s":"","db":[],"cr":[]},{"c":"9.1.01","n":"COMPROMISOS Y CONTINGENCIAS ACTIVAS","d":"","s":"","db":[],"cr":[]},{"c":"9.1.01.01","n":"Bienes Recibidos en Consignación","d":"Cuenta de orden deudora (de control o memorándum) que registra el valor de referencia de los bienes que la cooperativa recibe de terceros bajo la modalidad de consignación, sin que exista transferencia de propiedad a favor de la cooperativa; por su naturaleza extrapatrimonial, no forma parte del Activo ni se refleja en el Balance General, sino que se revela como información complementaria de control.","s":"Deudora","db":["El ingreso a las instalaciones de la cooperativa de bienes recibidos de terceros bajo la modalidad de consignación, por su valor de referencia acordado con el consignante.","Las nuevas remesas de bienes recibidas en consignación durante el ejercicio, que incrementan el compromiso de custodia asumido."],"cr":["La devolución de los bienes al consignante, o su venta o consumo por cuenta de terceros, que extingue el compromiso de custodia registrado.","El registro simultáneo, por el mismo valor, en la cuenta de contrapartida 9.2.01.01 – Responsabilidad por Bienes en Consignación."]},{"c":"9.1.01.02","n":"Garantías de Socios por Créditos de Insumos","d":"Cuenta de orden deudora que registra el valor de las garantías (personales, prendarias u otras) otorgadas por los socios a favor de la cooperativa, como respaldo de los anticipos o créditos de insumos que ésta les concede, sin que dicho valor constituya un activo real de la cooperativa.","s":"Deudora","db":["El registro del valor de las garantías constituidas por los socios al momento de otorgárseles anticipos o créditos de insumos (p. ej. cuenta 1.1.04.04 – Anticipos a personal eventual, o anticipos a socios según corresponda).","El incremento del valor de la garantía cuando se amplía o renueva el crédito de insumos otorgado al socio."],"cr":["La cancelación total del crédito de insumos por parte del socio, que libera la garantía correspondiente.","La ejecución de la garantía ante incumplimiento del socio, dando de baja el compromiso registrado."]},{"c":"9.2","n":"CUENTAS DE ORDEN ACREEDORAS","d":"","s":"","db":[],"cr":[]},{"c":"9.2.01","n":"CONTINGENCIAS PASIVAS Y COMPROMISOS FUTUROS","d":"","s":"","db":[],"cr":[]},{"c":"9.2.01.01","n":"Responsabilidad por Bienes en Consignación","d":"Cuenta de orden acreedora que registra, como contrapartida de la cuenta 9.1.01.01, la obligación de custodia y rendición de cuentas que asume la cooperativa frente a terceros por los bienes recibidos en consignación.","s":"Acreedora","db":["La devolución de los bienes al consignante, o su venta o consumo por cuenta de terceros, que extingue la responsabilidad de custodia asumida."],"cr":["El registro simultáneo, por el mismo valor, del ingreso de bienes recibidos en consignación reflejado en la cuenta 9.1.01.01 – Bienes Recibidos en Consignación.","El incremento de la responsabilidad de custodia ante nuevas remesas de bienes recibidas en consignación."]},{"c":"9.2.01.02","n":"Acreedores por Garantías de Socios","d":"Cuenta de orden acreedora que registra, como contrapartida de la cuenta 9.1.01.02, el compromiso de la cooperativa de restituir o liberar las garantías recibidas de los socios una vez cancelado el crédito de insumos correspondiente.","s":"Acreedora","db":["La cancelación del crédito de insumos garantizado, con la consiguiente liberación y devolución de la garantía al socio.","La ejecución de la garantía ante incumplimiento de pago del socio."],"cr":["El registro simultáneo, por el mismo valor, de la garantía recibida del socio reflejada en la cuenta 9.1.01.02 – Garantías de Socios por Créditos de Insumos."]}];
const lv=c=>c.c.split('.').length, det=D.filter(x=>lv(x)==4);
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const grp=D.filter(x=>lv(x)==1);
document.getElementById('gr').innerHTML='<option value="">Todos los grupos</option>'+grp.map(g=>`<option value="${g.c}">${g.c}. ${esc(g.n)}</option>`).join('');
document.getElementById('tot').textContent=det.length;
const li=a=>a.length?'<ul>'+a.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':'<span class="mut">—</span>';
function render(){
 const q=document.getElementById('q').value.toLowerCase().trim(),g=document.getElementById('gr').value;let h='';
 D.forEach(x=>{const l=lv(x);
  if(g&&!x.c.startsWith(g))return;
  if(l<4){ if(q)return; h+=l==1?`<div class="g">${x.c}. ${esc(x.n)}</div>`:`<div class="s">${x.c} ${esc(x.n)}</div>`;return}
  if(q&&!(x.c+' '+x.n).toLowerCase().includes(q))return;
  h+=`<details class="row"><summary><span class="cd">${x.c}</span><span class="nm">${esc(x.n)}</span><span class="nt ${x.s}">${esc(x.s)}</span></summary><div class="det"><h4>Definición</h4><p>${esc(x.d||'—')}</p><div class="cols"><div><h4>Se debita por</h4>${li(x.db)}</div><div><h4>Se acredita por</h4>${li(x.cr)}</div></div></div></details>`});
 document.getElementById('out').innerHTML=h||'<p class="mut">Sin resultados.</p>'}
q.oninput=render;gr.onchange=render;render();
csv.onclick=()=>{const r=[['Código','Cuenta','Naturaleza','Definición']].concat(det.map(x=>[x.c,x.n,x.s,x.d]));
 const t='\ufeff'+r.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='plan_de_cuentas_pollolandia.csv';a.click()};
</script></body></html>
